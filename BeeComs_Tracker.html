<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>BeeComs — Tracker Attività</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #f5f5f5; font-family: 'DM Mono', 'Courier New', monospace; min-height: 100vh; }
    #app { max-width: 480px; margin: 0 auto; }

    .header {
      padding: 28px 20px 16px;
      border-bottom: 1px solid #1f1f1f;
      position: sticky; top: 0;
      background: #0a0a0a; z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .brand { font-size: 10px; letter-spacing: 4px; color: #f59e0b; margin-bottom: 4px; text-transform: uppercase; }
    .title { font-size: 22px; font-weight: 700; letter-spacing: -1px; }
    .total-label { font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; text-align: right; }
    .total-count { font-size: 28px; font-weight: 700; color: #f59e0b; text-align: right; }

    .nav { display: flex; gap: 8px; }
    .nav-btn {
      flex: 1; padding: 8px 0; border-radius: 6px;
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
      border: 1px solid #222; background: #111; color: #888; font-weight: 400;
    }
    .nav-btn.active { background: #f59e0b; color: #0a0a0a; border-color: #f59e0b; font-weight: 700; }

    /* SYNC BAR */
    .sync-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px;
      background: #0d0d0d;
      border-bottom: 1px solid #141414;
      font-size: 11px;
    }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .sync-dot.ok    { background: #4ade80; box-shadow: 0 0 6px #4ade8066; }
    .sync-dot.warn  { background: #f59e0b; box-shadow: 0 0 6px #f59e0b66; }
    .sync-dot.off   { background: #333; }
    .sync-label { flex: 1; color: #666; letter-spacing: 1px; }
    .sync-btn {
      padding: 5px 12px; border-radius: 20px; font-size: 10px;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      font-family: inherit; transition: all 0.15s;
    }
    .sync-btn.connect { border: 1px solid #1a3a2a; background: #0d1f16; color: #4ade80; }
    .sync-btn.connect:hover { background: #112a1e; }
    .sync-btn.warn    { border: 1px solid #3a2a0a; background: #1f1500; color: #f59e0b; }
    .sync-btn.warn:hover { background: #291c00; }
    .sync-btn.change  { border: 1px solid #222; background: transparent; color: #444; }
    .sync-btn.change:hover { color: #666; }

    /* NOT SUPPORTED */
    .unsupported {
      margin: 20px; padding: 16px; background: #1a0a0a;
      border: 1px solid #3a1a1a; border-radius: 10px;
      font-size: 12px; color: #e57373; line-height: 1.6;
    }

    /* VIEWS */
    .view { padding: 12px 20px; }
    .view-form { padding: 20px; }

    .empty { text-align: center; padding: 60px 20px; color: #333; }
    .empty-icon { font-size: 32px; margin-bottom: 12px; }
    .empty-text { font-size: 13px; letter-spacing: 1px; }
    .empty-hint { font-size: 11px; color: #2a2a2a; margin-top: 8px; }

    .entry-card {
      margin-bottom: 10px; padding: 14px 16px;
      background: #111; border-radius: 10px;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .entry-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .entry-cat  { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .entry-dot  { font-size: 10px; color: #444; }
    .entry-date { font-size: 10px; color: #444; }
    .entry-activity { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .entry-output {
      display: inline-block; font-size: 10px; color: #888;
      background: #1a1a1a; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.5px;
    }
    .entry-notes { font-size: 12px; color: #555; margin-top: 6px; font-style: italic; }
    .entry-left { flex: 1; }
    .btn-delete {
      background: none; border: none; color: #2a2a2a;
      cursor: pointer; font-size: 18px; padding: 0 0 0 12px;
      line-height: 1; font-family: inherit; flex-shrink: 0; transition: color 0.15s;
    }
    .btn-delete:hover { color: #e53e3e; }

    .field { margin-bottom: 16px; }
    .field-last { margin-bottom: 24px; }
    .field label { font-size: 10px; letter-spacing: 2px; color: #555; text-transform: uppercase; display: block; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; background: #111; border: 1px solid #222; border-radius: 8px;
      padding: 12px 14px; color: #f5f5f5; font-family: inherit; font-size: 14px;
      box-sizing: border-box; outline: none; transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #333; }
    .field select { appearance: none; }
    .field textarea { resize: none; }

    .cat-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .cat-pill {
      padding: 8px 14px; border-radius: 20px; font-size: 11px;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
      border: 1px solid #222; background: #111; color: #666;
    }
    .btn-submit {
      width: 100%; padding: 16px; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      font-family: inherit; transition: all 0.15s; cursor: default;
      background: #1a1a1a; color: #333;
    }
    .btn-submit.active { background: #f59e0b; color: #0a0a0a; cursor: pointer; }

    .stats-section { margin-bottom: 24px; }
    .stats-title { font-size: 10px; letter-spacing: 3px; color: #555; text-transform: uppercase; margin-bottom: 14px; }
    .stats-bar-row { margin-bottom: 12px; }
    .stats-bar-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .stats-bar-track { height: 4px; background: #111; border-radius: 2px; }
    .stats-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
    .stats-output-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #151515; font-size: 13px; }
    .stats-output-label { color: #888; }
    .stats-output-count { color: #f59e0b; font-weight: 700; }
    .stats-box { padding: 16px; background: #111; border-radius: 10px; border: 1px solid #1f1f1f; }
    .stats-box-label { font-size: 10px; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-bottom: 10px; }
    .stats-box-value { font-size: 13px; color: #888; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1a1a1a; border: 1px solid #2a2a2a; color: #f5f5f5;
      padding: 10px 20px; border-radius: 20px; font-size: 12px; letter-spacing: 1px;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
      white-space: nowrap; z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ── COSTANTI ───────────────────────────────────────────────────────────────
const CATEGORIES = [
  { label: "Commerciale", color: "#f59e0b", icon: "◆" },
  { label: "Tecnico",     color: "#3b82f6", icon: "◉" },
  { label: "Marketing",  color: "#10b981", icon: "▲" },
  { label: "Admin",      color: "#8b5cf6", icon: "■" },
  { label: "Altro",      color: "#6b7280", icon: "●" },
];
const OUTPUTS = [
  "Cliente contattato","Demo effettuata","Preventivo inviato",
  "Incontro organizzato","Problema risolto","Materiale creato",
  "Installazione seguita","Altro",
];

const HAS_FSA = "showSaveFilePicker" in window;

// ── STATE ──────────────────────────────────────────────────────────────────
const state = {
  entries:    loadLocal(),
  view:       "list",
  form:       { date: today(), category: "Commerciale", activity: "", output: "Cliente contattato", notes: "" },
  sync:       "off",   // off | ok | warn | saving
  fileName:   null,
};
let fileHandle = null;

// ── LOCALSTORAGE ───────────────────────────────────────────────────────────
function loadLocal() {
  try { return JSON.parse(localStorage.getItem("beecoms_entries") || "[]"); } catch { return []; }
}
function saveLocal() {
  localStorage.setItem("beecoms_entries", JSON.stringify(state.entries));
}

// ── INDEXEDDB (per il file handle) ─────────────────────────────────────────
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("beecoms_db", 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore("kv");
    r.onsuccess = e => res(e.target.result);
    r.onerror = rej;
  });
}
async function dbGet(key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction("kv","readonly").objectStore("kv").get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = rej;
  });
}
async function dbSet(key, val) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv","readwrite");
    tx.objectStore("kv").put(val, key);
    tx.oncomplete = res;
    tx.onerror = rej;
  });
}

// ── FILE SYSTEM ACCESS API ─────────────────────────────────────────────────
async function connectDrive() {
  try {
    fileHandle = await window.showSaveFilePicker({
      suggestedName: "beecoms_dati.json",
      types: [{ description: "Dati BeeComs", accept: { "application/json": [".json"] } }],
    });
    await dbSet("fileHandle", fileHandle);
    state.fileName = fileHandle.name;
    await loadFromDrive();
    state.sync = "ok";
    showToast("✓ Connesso — salvataggio automatico attivo");
    render();
  } catch(e) {
    if (e.name !== "AbortError") showToast("✗ Connessione annullata");
  }
}

async function restoreConnection() {
  if (!HAS_FSA) return;
  try {
    const h = await dbGet("fileHandle");
    if (!h) return;
    fileHandle = h;
    state.fileName = h.name;
    const perm = await h.queryPermission({ mode: "readwrite" });
    if (perm === "granted") {
      await loadFromDrive();
      state.sync = "ok";
    } else {
      state.sync = "warn";
    }
    render();
  } catch {}
}

async function reactivate() {
  if (!fileHandle) return;
  try {
    const perm = await fileHandle.requestPermission({ mode: "readwrite" });
    if (perm === "granted") {
      await loadFromDrive();
      state.sync = "ok";
      showToast("✓ Sincronizzazione riattivata");
      render();
    }
  } catch {}
}

async function saveToDrive() {
  if (!fileHandle || state.sync === "off") return;
  try {
    const perm = await fileHandle.queryPermission({ mode: "readwrite" });
    if (perm !== "granted") { state.sync = "warn"; render(); return; }
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(state.entries, null, 2));
    await w.close();
    if (state.sync !== "ok") { state.sync = "ok"; render(); }
  } catch {
    state.sync = "warn";
    render();
  }
}

async function loadFromDrive() {
  if (!fileHandle) return;
  try {
    const file = await fileHandle.getFile();
    if (file.size === 0) return;
    const data = JSON.parse(await file.text());
    if (Array.isArray(data)) { state.entries = data; saveLocal(); }
  } catch {}
}

// ── AZIONI ─────────────────────────────────────────────────────────────────
function addEntry() {
  if (!state.form.activity.trim()) return;
  state.entries = [{ ...state.form, id: Date.now() }, ...state.entries];
  state.form = { ...state.form, activity: "", notes: "" };
  state.view = "list";
  saveLocal();
  saveToDrive();
  render();
}

function deleteEntry(id) {
  state.entries = state.entries.filter(e => e.id !== id);
  saveLocal();
  saveToDrive();
  render();
}

function setView(v)            { state.view = v; render(); }
function setField(k, v)        { state.form[k] = v; render(); }

// ── UTILS ───────────────────────────────────────────────────────────────────
function today() { return new Date().toISOString().split("T")[0]; }
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString("it-IT",{ day:"2-digit", month:"short", year:"numeric" });
}
function catColor(l) { return (CATEGORIES.find(c=>c.label===l)||{}).color||"#6b7280"; }
function catIcon(l)  { return (CATEGORIES.find(c=>c.label===l)||{}).icon||"●"; }
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

// ── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const activeId  = document.activeElement?.id;
  const selStart  = document.activeElement?.selectionStart;
  const selEnd    = document.activeElement?.selectionEnd;

  document.getElementById("app").innerHTML =
    renderHeader() + renderSyncBar() + renderView();
  bindEvents();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      try { el.setSelectionRange(selStart, selEnd); } catch {}
    }
  }
}

function renderHeader() {
  return `
  <div class="header">
    <div class="header-top">
      <div><div class="brand">BeeComs</div><div class="title">Attività</div></div>
      <div><div class="total-label">Totale</div><div class="total-count">${state.entries.length}</div></div>
    </div>
    <div class="nav">
      <button class="nav-btn ${state.view==="list" ?"active":""}" data-nav="list">Lista</button>
      <button class="nav-btn ${state.view==="add"  ?"active":""}" data-nav="add">+ Aggiungi</button>
      <button class="nav-btn ${state.view==="stats"?"active":""}" data-nav="stats">Stats</button>
    </div>
  </div>`;
}

function renderSyncBar() {
  if (!HAS_FSA) return `
    <div class="unsupported">
      ⚠ Il tuo browser non supporta il salvataggio automatico su file.<br>
      Usa <strong>Google Chrome</strong> o <strong>Microsoft Edge</strong> per abilitare la sincronizzazione con Google Drive Desktop.
    </div>`;

  if (state.sync === "off") return `
    <div class="sync-bar">
      <div class="sync-dot off"></div>
      <span class="sync-label">Non connesso a Google Drive</span>
      <button class="sync-btn connect" id="btn-connect">Connetti →</button>
    </div>`;

  if (state.sync === "warn") return `
    <div class="sync-bar">
      <div class="sync-dot warn"></div>
      <span class="sync-label">Sincronizzazione in pausa</span>
      <button class="sync-btn warn" id="btn-reactivate">Riattiva</button>
    </div>`;

  return `
    <div class="sync-bar">
      <div class="sync-dot ok"></div>
      <span class="sync-label" style="color:#4ade80">
        ${esc(state.fileName || "beecoms_dati.json")}
      </span>
      <button class="sync-btn change" id="btn-connect">Cambia</button>
    </div>`;
}

function renderView() {
  if (state.view === "list")  return renderList();
  if (state.view === "add")   return renderForm();
  if (state.view === "stats") return renderStats();
  return "";
}

function renderList() {
  if (!state.entries.length) return `
    <div class="view">
      <div class="empty">
        <div class="empty-icon">◉</div>
        <div class="empty-text">Nessuna attività ancora</div>
        <div class="empty-hint">Premi + Aggiungi per iniziare</div>
      </div>
    </div>`;

  return `<div class="view">${state.entries.map(e => `
    <div class="entry-card" style="border-left:3px solid ${catColor(e.category)}">
      <div class="entry-left">
        <div class="entry-meta">
          <span class="entry-cat" style="color:${catColor(e.category)}">${catIcon(e.category)} ${esc(e.category)}</span>
          <span class="entry-dot">·</span>
          <span class="entry-date">${fmtDate(e.date)}</span>
        </div>
        <div class="entry-activity">${esc(e.activity)}</div>
        <span class="entry-output">${esc(e.output)}</span>
        ${e.notes?`<div class="entry-notes">${esc(e.notes)}</div>`:""}
      </div>
      <button class="btn-delete" data-del="${e.id}">×</button>
    </div>`).join("")}</div>`;
}

function renderForm() {
  const f = state.form;
  return `
  <div class="view-form">
    <div class="field">
      <label>Data</label>
      <input type="date" id="f-date" value="${f.date}" />
    </div>
    <div class="field">
      <label>Categoria</label>
      <div class="cat-pills">${CATEGORIES.map(c=>{
        const a = f.category===c.label;
        return `<button class="cat-pill" data-cat="${c.label}"
          style="${a?`background:${c.color};color:#0a0a0a;border-color:${c.color};font-weight:700`:""}">
          ${c.icon} ${c.label}</button>`;}).join("")}
      </div>
    </div>
    <div class="field">
      <label>Attività *</label>
      <input type="text" id="f-activity" placeholder="Es: Demo con Logistica Rossi SpA" value="${esc(f.activity)}" />
    </div>
    <div class="field">
      <label>Output</label>
      <select id="f-output">${OUTPUTS.map(o=>`<option ${f.output===o?"selected":""}>${o}</option>`).join("")}</select>
    </div>
    <div class="field field-last">
      <label>Note (opzionale)</label>
      <textarea id="f-notes" rows="3" placeholder="Contesto, followup, dettagli...">${esc(f.notes)}</textarea>
    </div>
    <button class="btn-submit ${f.activity.trim()?"active":""}" id="btn-add">Salva Attività</button>
  </div>`;
}

function renderStats() {
  if (!state.entries.length) return `
    <div class="view"><div class="empty"><div class="empty-text">Nessun dato ancora</div></div></div>`;
  const total = state.entries.length;
  const catStats = CATEGORIES
    .map(c=>({...c, count:state.entries.filter(e=>e.category===c.label).length}))
    .filter(c=>c.count>0);
  return `
  <div class="view">
    <div class="stats-section">
      <div class="stats-title">Per categoria</div>
      ${catStats.map(c=>`
        <div class="stats-bar-row">
          <div class="stats-bar-label">
            <span style="font-size:12px;color:${c.color}">${c.icon} ${c.label}</span>
            <span style="font-size:12px;color:#888">${c.count} attività</span>
          </div>
          <div class="stats-bar-track">
            <div class="stats-bar-fill" style="width:${(c.count/total*100).toFixed(1)}%;background:${c.color}"></div>
          </div>
        </div>`).join("")}
    </div>
    <div class="stats-section">
      <div class="stats-title">Per output</div>
      ${OUTPUTS.map(o=>{
        const n=state.entries.filter(e=>e.output===o).length;
        if(!n) return "";
        return `<div class="stats-output-row"><span class="stats-output-label">${o}</span><span class="stats-output-count">${n}</span></div>`;
      }).join("")}
    </div>
    <div class="stats-box">
      <div class="stats-box-label">Prima attività registrata</div>
      <div class="stats-box-value">${state.entries.length ? fmtDate(state.entries[state.entries.length-1].date) : "—"}</div>
    </div>
  </div>`;
}

// ── BIND EVENTS ─────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click",()=>setView(b.dataset.nav)));
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click",()=>deleteEntry(Number(b.dataset.del))));
  document.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click",()=>setField("category",b.dataset.cat)));

  const q = id => document.getElementById(id);
  if(q("f-date"))     q("f-date").addEventListener("change", e=>setField("date",e.target.value));
  if(q("f-activity")) q("f-activity").addEventListener("input",  e=>setField("activity",e.target.value));
  if(q("f-output"))   q("f-output").addEventListener("change", e=>setField("output",e.target.value));
  if(q("f-notes"))    q("f-notes").addEventListener("input",   e=>setField("notes",e.target.value));
  if(q("btn-add"))    q("btn-add").addEventListener("click", addEntry);
  if(q("btn-connect"))    q("btn-connect").addEventListener("click", connectDrive);
  if(q("btn-reactivate")) q("btn-reactivate").addEventListener("click", reactivate);
}

// ── AVVIO ───────────────────────────────────────────────────────────────────
render();
restoreConnection();
</script>
</body>
</html>
