<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>BeeComs — Tracker Attività</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: 'DM Mono', 'Courier New', monospace;
      min-height: 100vh;
    }
    #app {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* HEADER */
    .header {
      padding: 28px 20px 16px;
      border-bottom: 1px solid #1f1f1f;
      position: sticky;
      top: 0;
      background: #0a0a0a;
      z-index: 10;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .brand { font-size: 10px; letter-spacing: 4px; color: #f59e0b; margin-bottom: 4px; text-transform: uppercase; }
    .title { font-size: 22px; font-weight: 700; letter-spacing: -1px; }
    .total-label { font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; text-align: right; }
    .total-count { font-size: 28px; font-weight: 700; color: #f59e0b; text-align: right; }

    /* NAV */
    .nav { display: flex; gap: 8px; }
    .nav-btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      border: 1px solid #222;
      background: #111;
      color: #888;
      font-weight: 400;
    }
    .nav-btn.active {
      background: #f59e0b;
      color: #0a0a0a;
      border-color: #f59e0b;
      font-weight: 700;
    }

    /* VIEWS */
    .view { padding: 12px 20px; }
    .view-form { padding: 20px; }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #333;
    }
    .empty-icon { font-size: 32px; margin-bottom: 12px; }
    .empty-text { font-size: 13px; letter-spacing: 1px; }
    .empty-hint { font-size: 11px; color: #2a2a2a; margin-top: 8px; }

    /* ENTRY CARD */
    .entry-card {
      margin-bottom: 10px;
      padding: 14px 16px;
      background: #111;
      border-radius: 10px;
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .entry-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .entry-cat {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .entry-dot { font-size: 10px; color: #444; }
    .entry-date { font-size: 10px; color: #444; }
    .entry-activity { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .entry-output {
      display: inline-block;
      font-size: 10px;
      color: #888;
      background: #1a1a1a;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .entry-notes { font-size: 12px; color: #555; margin-top: 6px; font-style: italic; }
    .entry-left { flex: 1; }
    .btn-delete {
      background: none;
      border: none;
      color: #333;
      cursor: pointer;
      font-size: 18px;
      padding: 0 0 0 12px;
      line-height: 1;
      font-family: inherit;
      flex-shrink: 0;
    }
    .btn-delete:hover { color: #e53e3e; }

    /* FORM */
    .field { margin-bottom: 16px; }
    .field-last { margin-bottom: 24px; }
    .field label {
      font-size: 10px;
      letter-spacing: 2px;
      color: #555;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 12px 14px;
      color: #f5f5f5;
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: #333;
    }
    .field select { appearance: none; }
    .field textarea { resize: none; }

    /* CATEGORY PILLS */
    .cat-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .cat-pill {
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      border: 1px solid #222;
      background: #111;
      color: #666;
    }

    /* SUBMIT */
    .btn-submit {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: inherit;
      transition: all 0.15s;
      cursor: default;
      background: #1a1a1a;
      color: #333;
    }
    .btn-submit.active {
      background: #f59e0b;
      color: #0a0a0a;
      cursor: pointer;
    }

    /* STATS */
    .stats-section { margin-bottom: 24px; }
    .stats-title {
      font-size: 10px;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .stats-bar-row { margin-bottom: 12px; }
    .stats-bar-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .stats-bar-track { height: 4px; background: #111; border-radius: 2px; }
    .stats-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
    .stats-output-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #151515;
      font-size: 13px;
    }
    .stats-output-label { color: #888; }
    .stats-output-count { color: #f59e0b; font-weight: 700; }
    .stats-box {
      padding: 16px;
      background: #111;
      border-radius: 10px;
      border: 1px solid #1f1f1f;
    }
    .stats-box-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .stats-box-value { font-size: 13px; color: #888; }

    /* DRIVE BAR */
    .drive-bar {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid #141414;
      background: #0a0a0a;
    }
    .btn-drive {
      flex: 1;
      padding: 9px 0;
      border-radius: 6px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      border: 1px solid #222;
      background: #111;
      color: #666;
      transition: all 0.15s;
    }
    .btn-drive:hover { border-color: #333; color: #aaa; }
    .btn-drive.save { border-color: #1a3a1a; background: #0d1f0d; color: #4ade80; }
    .btn-drive.save:hover { background: #122a12; }
    .btn-drive.load { border-color: #1a2a3a; background: #0d1822; color: #60a5fa; }
    .btn-drive.load:hover { background: #111f30; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #f5f5f5;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept=".json" style="display:none" />

<script>
const CATEGORIES = [
  { label: "Commerciale", color: "#f59e0b", icon: "◆" },
  { label: "Tecnico",     color: "#3b82f6", icon: "◉" },
  { label: "Marketing",  color: "#10b981", icon: "▲" },
  { label: "Admin",      color: "#8b5cf6", icon: "■" },
  { label: "Altro",      color: "#6b7280", icon: "●" },
];

const OUTPUTS = [
  "Cliente contattato",
  "Demo effettuata",
  "Preventivo inviato",
  "Incontro organizzato",
  "Problema risolto",
  "Materiale creato",
  "Installazione seguita",
  "Altro",
];

// ── STATE ──────────────────────────────────────────────────────────────────
let state = {
  entries: loadEntries(),
  view: "list",
  form: {
    date: today(),
    category: "Commerciale",
    activity: "",
    output: "Cliente contattato",
    notes: "",
  },
};

function today() {
  return new Date().toISOString().split("T")[0];
}

function loadEntries() {
  try { return JSON.parse(localStorage.getItem("beecoms_entries") || "[]"); }
  catch { return []; }
}

function saveEntries() {
  localStorage.setItem("beecoms_entries", JSON.stringify(state.entries));
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" });
}

function catColor(label) {
  return (CATEGORIES.find(c => c.label === label) || {}).color || "#6b7280";
}

function catIcon(label) {
  return (CATEGORIES.find(c => c.label === label) || {}).icon || "●";
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ── ACTIONS ────────────────────────────────────────────────────────────────
function setView(v) {
  state.view = v;
  render();
}

function setFormField(key, value) {
  state.form[key] = value;
  render();
}

function addEntry() {
  if (!state.form.activity.trim()) return;
  const entry = { ...state.form, id: Date.now() };
  state.entries = [entry, ...state.entries];
  state.form = { ...state.form, activity: "", notes: "" };
  state.view = "list";
  saveEntries();
  render();
}

function deleteEntry(id) {
  state.entries = state.entries.filter(e => e.id !== id);
  saveEntries();
  render();
}

// ── GOOGLE DRIVE (export / import) ────────────────────────────────────────
function exportToFile() {
  const data = JSON.stringify(state.entries, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "beecoms_dati.json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("✓ File scaricato — salvalo su Google Drive");
}

function importFromFile() {
  document.getElementById("file-input").click();
}

document.getElementById("file-input").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error();
      state.entries = data;
      saveEntries();
      render();
      showToast("✓ " + data.length + " attività caricate");
    } catch {
      showToast("✗ File non valido");
    }
  };
  reader.readAsText(file);
  this.value = "";
});

// ── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  app.innerHTML = renderHeader() + renderDriveBar() + renderView();
  bindEvents();
}

function renderHeader() {
  return `
    <div class="header">
      <div class="header-top">
        <div>
          <div class="brand">BeeComs</div>
          <div class="title">Attività</div>
        </div>
        <div>
          <div class="total-label">Totale</div>
          <div class="total-count">${state.entries.length}</div>
        </div>
      </div>
      <div class="nav">
        <button class="nav-btn ${state.view === 'list' ? 'active' : ''}" data-nav="list">Lista</button>
        <button class="nav-btn ${state.view === 'add'  ? 'active' : ''}" data-nav="add">+ Aggiungi</button>
        <button class="nav-btn ${state.view === 'stats'? 'active' : ''}" data-nav="stats">Stats</button>
      </div>
    </div>
  `;
}

function renderDriveBar() {
  return `
    <div class="drive-bar">
      <button class="btn-drive load" id="btn-import">↑ Carica da Drive</button>
      <button class="btn-drive save" id="btn-export">↓ Salva su Drive</button>
    </div>
  `;
}

function renderView() {
  if (state.view === "list")  return renderList();
  if (state.view === "add")   return renderForm();
  if (state.view === "stats") return renderStats();
  return "";
}

function renderList() {
  if (state.entries.length === 0) {
    return `
      <div class="view">
        <div class="empty">
          <div class="empty-icon">◉</div>
          <div class="empty-text">Nessuna attività ancora</div>
          <div class="empty-hint">Premi + Aggiungi per iniziare</div>
        </div>
      </div>`;
  }
  const cards = state.entries.map(e => `
    <div class="entry-card" style="border-left: 3px solid ${catColor(e.category)}">
      <div class="entry-left">
        <div class="entry-meta">
          <span class="entry-cat" style="color:${catColor(e.category)}">${catIcon(e.category)} ${e.category}</span>
          <span class="entry-dot">·</span>
          <span class="entry-date">${fmtDate(e.date)}</span>
        </div>
        <div class="entry-activity">${escHtml(e.activity)}</div>
        <span class="entry-output">${escHtml(e.output)}</span>
        ${e.notes ? `<div class="entry-notes">${escHtml(e.notes)}</div>` : ""}
      </div>
      <button class="btn-delete" data-delete="${e.id}">×</button>
    </div>
  `).join("");
  return `<div class="view">${cards}</div>`;
}

function renderForm() {
  const f = state.form;
  const catPills = CATEGORIES.map(cat => {
    const active = f.category === cat.label;
    const style = active
      ? `background:${cat.color};color:#0a0a0a;border-color:${cat.color};font-weight:700`
      : "";
    return `<button class="cat-pill" data-cat="${cat.label}" style="${style}">${cat.icon} ${cat.label}</button>`;
  }).join("");

  const outputOpts = OUTPUTS.map(o =>
    `<option value="${o}" ${f.output === o ? "selected" : ""}>${o}</option>`
  ).join("");

  const submitActive = f.activity.trim() ? "active" : "";

  return `
    <div class="view-form">
      <div class="field">
        <label>Data</label>
        <input type="date" id="f-date" value="${f.date}" />
      </div>
      <div class="field">
        <label>Categoria</label>
        <div class="cat-pills">${catPills}</div>
      </div>
      <div class="field">
        <label>Attività *</label>
        <input type="text" id="f-activity" placeholder="Es: Demo con Logistica Rossi SpA" value="${escAttr(f.activity)}" />
      </div>
      <div class="field">
        <label>Output</label>
        <select id="f-output">${outputOpts}</select>
      </div>
      <div class="field field-last">
        <label>Note (opzionale)</label>
        <textarea id="f-notes" rows="3" placeholder="Contesto, followup, dettagli...">${escHtml(f.notes)}</textarea>
      </div>
      <button class="btn-submit ${submitActive}" id="btn-add">Salva Attività</button>
    </div>
  `;
}

function renderStats() {
  if (state.entries.length === 0) {
    return `<div class="view"><div class="empty"><div class="empty-text">Nessun dato ancora</div></div></div>`;
  }

  const total = state.entries.length;
  const catStats = CATEGORIES
    .map(cat => ({ ...cat, count: state.entries.filter(e => e.category === cat.label).length }))
    .filter(c => c.count > 0);

  const barsHtml = catStats.map(c => `
    <div class="stats-bar-row">
      <div class="stats-bar-label">
        <span style="font-size:12px;color:${c.color}">${c.icon} ${c.label}</span>
        <span style="font-size:12px;color:#888">${c.count} attività</span>
      </div>
      <div class="stats-bar-track">
        <div class="stats-bar-fill" style="width:${(c.count/total*100).toFixed(1)}%;background:${c.color}"></div>
      </div>
    </div>
  `).join("");

  const outputHtml = OUTPUTS.map(o => {
    const count = state.entries.filter(e => e.output === o).length;
    if (!count) return "";
    return `
      <div class="stats-output-row">
        <span class="stats-output-label">${o}</span>
        <span class="stats-output-count">${count}</span>
      </div>`;
  }).join("");

  const first = state.entries.length > 0 ? fmtDate(state.entries[state.entries.length - 1].date) : "—";

  return `
    <div class="view">
      <div class="stats-section">
        <div class="stats-title">Per categoria</div>
        ${barsHtml}
      </div>
      <div class="stats-section">
        <div class="stats-title">Per output</div>
        ${outputHtml}
      </div>
      <div class="stats-box">
        <div class="stats-box-label">Prima attività registrata</div>
        <div class="stats-box-value">${first}</div>
      </div>
    </div>
  `;
}

// ── BIND EVENTS ────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.addEventListener("click", () => setView(btn.dataset.nav));
  });

  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", () => deleteEntry(Number(btn.dataset.delete)));
  });

  document.querySelectorAll("[data-cat]").forEach(btn => {
    btn.addEventListener("click", () => setFormField("category", btn.dataset.cat));
  });

  const fDate     = document.getElementById("f-date");
  const fActivity = document.getElementById("f-activity");
  const fOutput   = document.getElementById("f-output");
  const fNotes    = document.getElementById("f-notes");
  const btnAdd    = document.getElementById("btn-add");

  if (fDate)     fDate.addEventListener("change",  e => setFormField("date",     e.target.value));
  if (fActivity) fActivity.addEventListener("input",  e => setFormField("activity", e.target.value));
  if (fOutput)   fOutput.addEventListener("change",  e => setFormField("output",   e.target.value));
  if (fNotes)    fNotes.addEventListener("input",   e => setFormField("notes",    e.target.value));
  if (btnAdd)    btnAdd.addEventListener("click",   addEntry);

  const btnExport = document.getElementById("btn-export");
  const btnImport = document.getElementById("btn-import");
  if (btnExport) btnExport.addEventListener("click", exportToFile);
  if (btnImport) btnImport.addEventListener("click", importFromFile);
}

// ── UTILS ──────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function escAttr(str) { return escHtml(str); }

// ── BOOT ───────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
